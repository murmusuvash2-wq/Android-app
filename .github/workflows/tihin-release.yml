name: TiHin Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version, for example 1.0.1"
        required: true
        type: string
      version_code:
        description: "Android versionCode, for example 2"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Restore stable CI debug keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: tihin-debug-keystore-v1

      - name: Generate stable CI debug keystore when missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build release APK
        run: |
          gradle :app:assembleDebug \
            -PversionName="${{ inputs.version_name }}" \
            -PversionCode="${{ inputs.version_code }}" \
            --stacktrace

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "TiHin-${{ inputs.version_name }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version_name }}" \
            "TiHin-${{ inputs.version_name }}.apk" \
            --title "TiHin v${{ inputs.version_name }}" \
            --notes "${{ inputs.release_notes }}"
